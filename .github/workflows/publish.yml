
on:
  push:
    branches: ["renovate/**"]
  workflow_dispatch:

jobs:
  # test:
  #   strategy:
  #     matrix:
  #       os: [ ubuntu-latest, macos-latest, windows-latest ]
  #   runs-on: ${{ matrix.os }}
  #
  #   steps:
  #   - uses: actions/checkout@v5
  #   - run: cargo test -- --nocapture
  #     env:
  #       OUT_DIR: target
  
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - run: cargo update
    - id: version
      run: echo "version=v$(cargo pkgid | cut -d '#' -f 2)" >> "$GITHUB_OUTPUT"

  build: # adapted from https://github.com/foresterre/cargo-msrv/blob/main/.github/workflows/build-release-binaries.yaml
    runs-on: ${{ matrix.os }}
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tgz
            kind: linux

          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive_ext: tgz
            kind: linux

          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive_ext: tgz
            kind: macos

          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: tgz
            kind: macos

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip
            kind: windows

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
      with:
        toolchain: stable
        target: ${{ matrix.target }}
    - shell: bash
      run: |
        echo "archive=flight-network-planner-${{ matrix.target }}-${{ needs.version.outputs.version }}.${{ matrix.archive_ext }}" >> $GITHUB_ENV
        echo "subfolder=flight-network-planner-${{ matrix.target }}-${{ needs.version.outputs.version }}" >> $GITHUB_ENV
    - shell: bash
      run: mkdir ${{ env.subfolder }}

    - if: matrix.target == 'x86_64-unknown-linux-musl'
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: musl-tools
        version: 1.0

    - shell: bash
      run: cargo --locked build --target=${{ matrix.target }} --release
      
    - if: matrix.kind == 'macos'
      shell: bash
      run: |
        cp  ./target/${{ matrix.target }}/release/flight-network-planner ${{ env.subfolder }}
        gtar --create --gzip --file=${{ env.archive }} ${{ env.subfolder }}
    - if: matrix.kind == 'linux'
      shell: bash
      run: |
        cp target/${{ matrix.target }}/release/flight-network-planner ${{ env.subfolder }}
        tar --create --gzip --file=${{ env.archive }} ${{ env.subfolder }}
    - if: matrix.kind == 'windows'
      shell: bash
      run: |
        cp target/${{ matrix.target }}/release/flight-network-planner.exe ./${{ env.subfolder }}
        7z a -tzip ${{ env.archive }} ${{ env.subfolder }}
    
    - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: ${{ matrix.target }}
        path: ./${{ env.archive }}


  github-release:
    runs-on: ubuntu-latest
    needs: [build, version]
    if: github.event_name != 'pull_request' && !startsWith(github.ref_name, 'renovate/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1.0.7
        with:
          toolchain: stable

      - run: cargo package
      - run: mkdir dist
      - run: mv target/package/*.crate dist
      
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: x86_64-unknown-linux-musl
          path: dist
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: x86_64-apple-darwin
          path: dist
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: aarch64-apple-darwin
          path: dist
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: x86_64-pc-windows-msvc
          path: dist

      - uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ needs.version.outputs.version }}
          files: dist/*

  crates-io:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && !startsWith(github.ref_name, 'renovate/')
    environment: crates
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: rust-lang/crates-io-auth-action@b7e9a28eded4986ec6b1fa40eeee8f8f165559ec # v1.0.3
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
