name: Publish

on:
  push:
    tags: ["**"]
  workflow_dispatch:

jobs:
  changelog-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
        submodules: true
    - uses: ./.github/actions/mise
      with:
          cache: false
          envs: ''

    - id: version
      run: echo "version=v$(cargo pkgid | cut -d '#' -f 2)" >> "$GITHUB_OUTPUT"
    - id: changelog
      run: |
        {
          echo 'changelog<<__EOF__'
          python -c "
        import os
        version = os.environ['VERSION']
        print('\n'.join(open('CHANGELOG.md').read().split('## '+version)[1].split('\n')[1:]).split('\n##')[0])
          "
          echo __EOF__
        } >> "$GITHUB_OUTPUT"
      env:
        VERSION: ${{ steps.version.outputs.version }}

  build: # adapted from https://github.com/foresterre/cargo-msrv/blob/main/.github/workflows/build-release-binaries.yaml
    runs-on: ${{ matrix.os }}
    needs: changelog-version
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tgz
            kind: linux

          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive_ext: tgz
            kind: linux

          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive_ext: tgz
            kind: macos

          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: tgz
            kind: macos

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip
            kind: windows

          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive_ext: zip
            kind: windows

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
        submodules: true
    - uses: ./.github/actions/mise
      with:
          cache: false
          envs: ''
    - run: rustup target add ${{ matrix.target }}

    - shell: bash
      run: |
        echo "ARCHIVE=flight-network-planner-${{ matrix.target }}-$VERSION.${{ matrix.archive_ext }}" >> "$GITHUB_ENV"
        echo "SUBFOLDER=flight-network-planner-${{ matrix.target }}-$VERSION" >> "$GITHUB_ENV"
      env:
        VERSION: ${{ needs.changelog-version.outputs.version }}
    - shell: bash
      run: mkdir "$SUBFOLDER"

    - if: matrix.target == 'x86_64-unknown-linux-musl'
      env:
        # renovate: datasource=deb depName=musl-tools registryUrl=https://archive.ubuntu.com/ubuntu?suite=noble&components=main,multiverse,restricted,universe&binaryArch=amd64
        MUSL_TOOLS_VERSION: 1.2.4-2
      run: |
        sudo apt update
        sudo apt install -y --no-install-recommends "musl-tools=$MUSL_TOOLS_VERSION"

    - shell: bash
      run: cargo build --locked --target=${{ matrix.target }} --release
      
    - if: matrix.kind == 'macos'
      shell: bash
      run: |
        cp target/${{ matrix.target }}/release/flight-network-planner "$SUBFOLDER"
        gtar --create --gzip --file="$ARCHIVE" "$SUBFOLDER"
    - if: matrix.kind == 'linux'
      shell: bash
      run: |
        cp target/${{ matrix.target }}/release/flight-network-planner "$SUBFOLDER"
        tar --create --gzip --file="$ARCHIVE" "$SUBFOLDER"
    - if: matrix.kind == 'windows'
      shell: bash
      run: |
        cp target/${{ matrix.target }}/release/flight-network-planner.exe "./$SUBFOLDER"
        7z a -tzip "$ARCHIVE" "$SUBFOLDER"

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ matrix.target }}
        path: ./${{ env.ARCHIVE }}

  github-release:
    runs-on: ubuntu-latest
    needs: [build, changelog-version]
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/mise
        with:
          cache: false
          envs: ''

      - run: cargo package --locked
      - run: mkdir dist
      - run: mv target/package/*.crate dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: x86_64-unknown-linux-musl
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: x86_64-apple-darwin
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aarch64-apple-darwin
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: x86_64-pc-windows-msvc
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aarch64-pc-windows-msvc
          path: dist

      - uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2  # zizmor: ignore[superfluous-actions]
        with:
          body: ${{ needs.changelog-version.outputs.changelog }}
          tag_name: ${{ needs.changelog-version.outputs.version }}
          files: dist/*

  crates-io:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: crates
      url: https://crates.io/crates/flight-network-planner
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/mise
        with:
          cache: false
          envs: ''
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  delete-github-release:
    runs-on: ubuntu-slim
    needs: [ changelog-version, build, github-release, crates-io ]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: gh release delete "$TAG" --cleanup-tag -y
        env:
          TAG: ${{ needs.changelog-version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
